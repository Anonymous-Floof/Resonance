[package]
name = "mp-net"
description = "Outbound requests for Resonance, and the log that discloses them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `ureq` is the only HTTP client in the workspace, and this is the only crate
# allowed to depend on one — so that `cargo tree` stays a complete answer to
# "what can this talk to". Blocking rather than async on purpose: the rest of
# the codebase is threads and channels, and a full async runtime would cost
# more of the dependency tree than a handful of small GETs can justify.
#
# Default features minus `gzip`: the responses here are a few kilobytes of
# JSON, so compression buys nothing and costs a decompressor in the tree.
#
# No dependency on mp-core. Nothing here needs the library or the settings, and
# staying out of them keeps merges from `main` cheap — it is also why fetched
# lyrics travel back as text and are parsed on the other side.
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile.workspace = true
